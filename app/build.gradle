plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.genericsassignment'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.genericsassignment"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // Дополнительные библиотеки не нужны — используется только стандартный Android SDK
}
